[project]
name = "pytest-exercises"
version = "0.0.1"
description = "Runnable exercises behind the Pytest lessons"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["exercises"]
addopts = "-ra"
markers = [
    "slow: a test that takes a while",
    "integration: a test that uses more than one module",
]
