# A proposed next version of the orders contract. Each difference from v1 is a different kind of change.
dataset: orders
version: 2
owner: orders-platform
consumers: [finance, marketing]
purpose: Daily revenue reporting and customer campaigns
schema:
  - {name: order_id, type: BIGINT, nullable: false, unique: true, description: "Unique id of the order, assigned by the orders service."}
  - {name: customer_id, type: VARCHAR, nullable: false, description: "Id of the customer who placed the order, as in the customers dataset."}          # type changed
  - {name: order_ts, type: TIMESTAMP, nullable: true, description: "When the customer placed the order (UTC)."}            # nullable false -> true
  - {name: ingested_at, type: TIMESTAMP, nullable: false, description: "When the row reached the warehouse (UTC)."}
  - {name: status, type: VARCHAR, nullable: false, allowed: [PLACED, SHIPPED, CANCELLED, RETURNED], description: "Where the order is in its life: placed, shipped or cancelled."}  # new allowed value
  - {name: amount_total, type: DOUBLE, nullable: false, description: "Order total in the shop currency, including tax."}          # renamed from total_amount
  - {name: shipped_ts, type: TIMESTAMP, nullable: true, description: "When the order left the warehouse (UTC). Empty until it ships."}
  - {name: channel, type: VARCHAR, nullable: true, description: "Sales channel the order came from."}               # new optional column
  - {name: currency, type: VARCHAR, nullable: false, description: "ISO 4217 currency code of the order."}             # new required column
quality:
  rules: [ORD-ID-UNIQUE, ORD-CUST-POPULATED, ORD-CUST-EXISTS, ORD-TOTAL-MATCHES-PAID]
freshness:
  column: order_ts
  max_age_hours: 24
on_breach:
  notify: "#orders-data"
  respond_within_hours: 2
  resolve_within_business_days: 1
